<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118" role="img" aria-label="Escudo médico Vytaris">
  <defs>
    <!-- Gradiente: azul ligeramente más claro que el header para que contraste -->
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2B72D8"/>
      <stop offset="100%" stop-color="#1340A0"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo del escudo -->
  <path
    d="M50 4 C38 4 12 15 12 15 L12 52 C12 80 28 95 50 104 C72 95 88 80 88 52 L88 15 C88 15 62 4 50 4 Z"
    fill="url(#sg)"
  />
  <!-- Borde blanco semitransparente para hacerlo visible sobre el header azul -->
  <path
    d="M50 4 C38 4 12 15 12 15 L12 52 C12 80 28 95 50 104 C72 95 88 80 88 52 L88 15 C88 15 62 4 50 4 Z"
    fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"
  />

  <!-- Cruz médica — barra vertical (centrada en 50,53) -->
  <rect x="44.5" y="29" width="11" height="48" rx="3" fill="white"/>
  <!-- Cruz médica — barra horizontal -->
  <rect x="26" y="47.5" width="48" height="11" rx="3" fill="white"/>

  <!-- Arco verde izquierdo: inicio 120° (36,77) → fin 270° (50,25), sentido antihorario -->
  <path d="M 36 77 A 28 28 0 0 0 50 25" stroke="#2DC78A" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Arco verde derecho: inicio 330° (74,39) → fin 90° (50,81), sentido horario -->
  <path d="M 74 39 A 28 28 0 0 1 50 81" stroke="#2DC78A" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
